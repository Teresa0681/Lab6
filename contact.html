<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pet Care Services | Contact</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar md:navbar-expand bg-1 fg-2">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                Pet Care Services
            </a>

            <button class="btn-icon navbar-toggler"
                    type="button"
                    data-bs-toggle="drawer"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"
                      aria-hidden="true"></span>
            </button>

            <dialog class="drawer drawer-end"
                    tabindex="-1"
                    id="navbarNav"
                    aria-labelledby="navbarNavLabel">

                <div class="drawer-header">
                    <h2 class="drawer-title h5" id="navbarNavLabel">
                        Menu
                    </h2>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="drawer"
                            aria-label="Close">
                    </button>
                </div>

                <div class="drawer-body">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link"
                               href="index.html">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               href="index.html#services">
                                Our Services
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active"
                               aria-current="page"
                               href="contact.html">
                                Contact
                            </a>
                        </li>

                    </ul>
                </div>

            </dialog>

        </div>
    </nav>

    <!-- Contact Form -->
    <main class="container mt-5">

        <h1>Contact Us</h1>

        <p>
            Have a question about our pet care services?
            Please fill out the form below.
        </p>

        <form action="#" method="get">

            <div class="row g-4">

                <!-- First Name -->
                <div class="col-12 md:col-6">
                    <div class="form-field">

                        <label for="firstName" class="form-label">
                            First Name
                        </label>

                        <input type="text"
                               class="form-control"
                               id="firstName"
                               name="firstName"
                               required>

                    </div>
                </div>

                <!-- Last Name -->
                <div class="col-12 md:col-6">
                    <div class="form-field">

                        <label for="lastName" class="form-label">
                            Last Name
                        </label>

                        <input type="text"
                               class="form-control"
                               id="lastName"
                               name="lastName"
                               required>

                    </div>
                </div>

                <!-- Email -->
                <div class="col-12 md:col-6">
                    <div class="form-field">

                        <label for="email" class="form-label">
                            Email Address
                        </label>

                        <input type="email"
                               class="form-control"
                               id="email"
                               name="email"
                               placeholder="Enter your email address"
                               required>

                    </div>
                </div>

                <!-- Service -->
                <div class="col-12 md:col-6">
                    <div class="form-field">

                        <label for="service" class="form-label">
                            Choose a Service
                        </label>

                        <select class="form-control"
                                id="service"
                                name="service"
                                required>

                            <option value="" selected disabled>
                                Select a service
                            </option>

                            <option value="dogBathing">
                                Dog Bathing
                            </option>

                            <option value="catBathing">
                                Cat Bathing
                            </option>

                            <option value="playtime">
                                Pet Playtime
                            </option>

                            <option value="training">
                                Dog Training
                            </option>

                            <option value="sitting">
                                Pet Sitting
                            </option>

                            <option value="grooming">
                                Dog Grooming
                            </option>

                        </select>

                    </div>
                </div>

                <!-- Message -->
                <div class="col-12">
                    <div class="form-field">

                        <label for="message" class="form-label">
                            Your Message
                        </label>

                        <textarea class="form-control"
                                  id="message"
                                  name="message"
                                  rows="4"
                                  required></textarea>

                    </div>
                </div>

                <!-- Consent Checkbox -->
                <div class="col-12">
                    <div class="form-field">

                        <div>
                            <input type="checkbox"
                                   class="check"
                                   id="agreement"
                                   name="agreement"
                                   required>

                            <label for="agreement">
                                I agree to be contacted about my request.
                            </label>
                        </div>

                    </div>
                </div>

                <!-- Submit Button -->
                <div class="col-12">

                    <button type="submit"
                            class="btn-solid theme-primary">
                        Send Message
                    </button>

                </div>

            </div>

        </form>

    </main>

    <!-- Footer -->
    <footer class="container mt-5 mb-4">
        <p>Pet Care Services</p>
    </footer>

</body>
</html>
