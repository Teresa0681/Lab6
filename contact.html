
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Care Services | Contact</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                Pet Care Services
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="offcanvas offcanvas-end"
                tabindex="-1"
                id="navbarNav"
                aria-labelledby="navbarNavLabel">

                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="navbarNavLabel">
                        Menu
                    </h5>
                    <button type="button" class="btn-close"
                        data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>

                <div class="offcanvas-body">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="index.html#services">
                                Our Services
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active"
                                aria-current="page"
                                href="contact.html">
                                Contact
                            </a>
                        </li>

                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contact Form -->
    <main class="container mt-5">

        <h1>Contact Us</h1>

        <p>
            Have a question about our pet care services?
            Please fill out the form below.
        </p>

        <form action="#" method="get">

            <div class="row g-3">

                <!-- Field 1 -->
                <div class="col-md-6">
                    <label for="firstName" class="form-label">
                        First Name
                    </label>
                    <input type="text"
                        class="form-control"
                        id="firstName"
                        name="firstName"
                        required>
                </div>

                <!-- Field 2 -->
                <div class="col-md-6">
                    <label for="lastName" class="form-label">
                        Last Name
                    </label>
                    <input type="text"
                        class="form-control"
                        id="lastName"
                        name="lastName"
                        required>
                </div>

                <!-- Field 3 -->
                <div class="col-md-6">
                    <label for="email" class="form-label">
                        Email Address
                    </label>
                    <input type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        required>
                </div>

                <!-- Field 4 -->
                <div class="col-md-6">
                    <label for="phone" class="form-label">
                        Phone Number
                    </label>
                    <input type="tel"
                        class="form-control"
                        id="phone"
                        name="phone">
                </div>

                <!-- Field 5 -->
                <div class="col-12">
                    <label for="service" class="form-label">
                        Choose a Service
                    </label>
                    <select class="form-select"
                        id="service"
                        name="service"
                        required>
                        <option value="" selected disabled>
                            Select a service
                        </option>
                        <option value="dogBathing">Dog Bathing</option>
                        <option value="catBathing">Cat Bathing</option>
                        <option value="playtime">Pet Playtime</option>
                        <option value="activities">Dog Activities</option>
                        <option value="sitting">Pet Sitting</option>
                        <option value="grooming">Dog Grooming</option>
                    </select>
                </div>

                <!-- Field 6 -->
                <div class="col-12">
                    <label for="message" class="form-label">
                        Your Message
                    </label>
                    <textarea class="form-control"
                        id="message"
                        name="message"
                        rows="4"
                        required></textarea>
                </div>

                <!-- Checkbox -->
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input"
                            type="checkbox"
                            id="agreement"
                            name="agreement"
                            required>
                        <label class="form-check-label"
                            for="agreement">
                            I agree to be contacted about my request.
                        </label>
                    </div>
                </div>

                <!-- Submit -->
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        Send Message
                    </button>
                </div>

            </div>

        </form>

    </main>

    <footer class="container mt-5 mb-4">
        <p>Pet Care Services</p>
    </footer>

</body>
</html>
